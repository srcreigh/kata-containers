[hypervisor.firecracker]
path = "/dev/null"
jailer_path = "/dev/null"
kernel = "/dev/null"
image = "/dev/null"
rootfs_type = "ext4"
default_vcpus = 1
default_maxvcpus = 2
default_memory = 256
memory_slots = 1
shared_fs = "none"
block_device_driver = "virtio-blk-mmio"
enable_guest_swap = false
enable_annotations = ["path", "jailer_path"]

[agent.agent0]

[runtime]
name = "virt_container"
hypervisor_name = "firecracker"
agent_name = "agent0"
static_sandbox_resource_mgmt = true
sandbox_cgroup_only = true
disable_guest_seccomp = true
