[package]
name = "kata-agent"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oci-spec.workspace = true
lazy_static.workspace = true
ttrpc.workspace = true
protobuf.workspace = true
libc.workspace = true
nix.workspace = true
capctl.workspace = true
serde_json.workspace = true
scan_fmt.workspace = true
scopeguard.workspace = true
thiserror.workspace = true
regex.workspace = true
serial_test.workspace = true
derivative.workspace = true

# Async helpers
async-trait.workspace = true
async-recursion.workspace = true
futures.workspace = true

# Async runtime
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-vsock.workspace = true

netlink-sys.workspace = true
rtnetlink.workspace = true
netlink-packet-route.workspace = true
netlink-packet-core.workspace = true
ipnetwork.workspace = true

slog.workspace = true
slog-scope.workspace = true
slog-term.workspace = true

# Redirect ttrpc log calls
slog-stdlog.workspace = true
log.workspace = true

prometheus.workspace = true
procfs.workspace = true

anyhow.workspace = true

cgroups.workspace = true


# Configuration
serde.workspace = true
toml.workspace = true
clap.workspace = true

# Local dependencies
rustjail.workspace = true
protocols = { workspace = true, features = ["async", "with-serde"] }
kata-sys-util.workspace = true
kata-types.workspace = true
runtime-spec.workspace = true
safe-path.workspace = true
# Note: this crate sets the slog 'max_*' features which allows the log level
# to be modified at runtime.
logging.workspace = true
pathrs.workspace = true



[dev-dependencies]
tempfile.workspace = true
which.workspace = true
rstest.workspace = true

test-utils.workspace = true

[profile.release]
lto = true

[features]
seccomp = ["rustjail/seccomp"]
