[package]
name = "hypervisor"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-rt = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
go-flag = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
rust-ini = "0.18.0"
seccompiler = "0.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "process", "io-util"] }
rand = { workspace = true }
path-clean = "1.0.1"
tracing = { workspace = true }
ttrpc = { workspace = true, features = ["async"] }
futures = "0.3.25"
crossbeam-channel = "0.5.6"
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
regex = "1"
once_cell = "1.21.3"
# Local dependencies
kata-sys-util = { workspace = true }
kata-types = { workspace = true }
logging = { workspace = true }
protocols = { workspace = true, features = ["async"] }
persist = { workspace = true }
safe-path = { workspace = true }
tempfile = { workspace = true }

# Firecracker's HTTP client uses a Unix-domain socket.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
hyperlocal = { workspace = true }

[features]
default = []

[dev-dependencies]
rstest = { workspace = true }
serial_test = "2.0.0"

# Local dev-dependencies
hypervisor = { workspace = true }
test-utils = { workspace = true }

[build-dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("enable-vendor"))',
] }
