[package]
name = "runtimes"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }

[dependencies]
anyhow = { workspace = true }
lazy_static = { workspace = true }
netns-rs = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
containerd-shim-protos = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { version = "0.18.0", features = [
    "rt-tokio-current-thread",
    "trace",
    "rt-tokio",
] }
# Jaeger uses Hyper 0.14, independently of the runtime's Hyper 1.x.
# Without http1 it sends HTTP/2 prior knowledge to an HTTP/1 collector.
hyper-jaeger = { package = "hyper", version = "0.14", default-features = false, features = ["http1"] }
opentelemetry-jaeger = { version = "0.17.0", features = [
    "rt-tokio",
    "hyper_collector_client",
    "collector_client",
] }
tracing-subscriber = { version = "0.3", features = ["registry", "std"] }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
nix = { workspace = true }
url = { workspace = true }
procfs = "0.12.0"
prometheus = { version = "0.14.0", features = ["process"] }
oci-spec = { workspace = true }

# Local dependencies
agent = { workspace = true }
common = { workspace = true }
kata-types = { workspace = true }
protocols = { workspace = true }
protobuf = { workspace = true }
kata-sys-util = { workspace = true }
logging = { workspace = true }
runtime-spec = { workspace = true }
shim-interface = { workspace = true }
persist = { workspace = true }
hypervisor = { workspace = true }
resource = { workspace = true }

# Local dependencies: runtime handler
virt_container = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["hyper-jaeger"]
